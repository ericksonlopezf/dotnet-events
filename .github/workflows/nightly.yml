name: Nightly Deep Quality & Ecosystem Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Daily at 02:00 UTC

jobs:
  deep-validation:
    name: Nightly Deep Build, Test & Package Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore EricksonLopez.Events.slnx

    - name: Build Solution (Strict Warnings As Errors)
      run: dotnet build EricksonLopez.Events.slnx -c Release --no-restore

    - name: Run Full Test Suite with Detailed Coverage
      run: dotnet test EricksonLopez.Events.slnx -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Verify Package Generation
      run: dotnet pack EricksonLopez.Events.slnx -c Release --no-build

    - name: Run Native AOT Tests (Windows)
      if: runner.os == 'Windows'
      run: |
        dotnet publish tests/EricksonLopez.Events.AotSmokeTest/EricksonLopez.Events.AotSmokeTest.csproj -c Release -r win-x64 -p:PublishAot=true
        .\tests\EricksonLopez.Events.AotSmokeTest\bin\Release\net10.0\win-x64\publish\EricksonLopez.Events.AotSmokeTest.exe

    - name: Run Native AOT Tests (Linux)
      if: runner.os == 'Linux'
      run: |
        dotnet publish tests/EricksonLopez.Events.AotSmokeTest/EricksonLopez.Events.AotSmokeTest.csproj -c Release -r linux-x64 -p:PublishAot=true
        chmod +x ./tests/EricksonLopez.Events.AotSmokeTest/bin/Release/net10.0/linux-x64/publish/EricksonLopez.Events.AotSmokeTest
        ./tests/EricksonLopez.Events.AotSmokeTest/bin/Release/net10.0/linux-x64/publish/EricksonLopez.Events.AotSmokeTest
