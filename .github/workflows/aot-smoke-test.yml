name: NativeAOT Smoke Test

# ─── Purpose ────────────────────────────────────────────────────────────────
# This workflow validates that EricksonLopez.Events packages are genuinely
# NativeAOT-compatible, not just declared as such via IsAotCompatible=true.
#
# The smoke test:
#   1. Restores and builds the solution in Release mode.
#   2. Publishes the NativeAotTests console app with PublishAot=true. If any
#      referenced API uses reflection, MakeGenericType, or Expression.Compile
#      without the [RequiresDynamicCode] / [RequiresUnreferencedCode] guards,
#      ILC will emit IL2026 / IL3050 warnings — which we treat as errors.
#   3. Runs the published native binary and asserts a zero exit code.
# ────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    secrets:
      SNK_KEY:
        description: "Base64-encoded Strong Name key (.snk) for assembly signing"
        required: false
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  aot-smoke-test:
    name: NativeAOT Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.Events.snk
          fi

      - name: Install NativeAOT prerequisites (clang, lld, zlib)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld zlib1g-dev

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Events.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Events.slnx --no-restore --configuration Release

      - name: Publish AotSmokeTest (NativeAOT)
        run: >
          dotnet publish
          tests/EricksonLopez.Events.AotSmokeTest/EricksonLopez.Events.AotSmokeTest.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained
          -p:PublishAot=true
          -p:TreatWarningsAsErrors=true
          -p:WarningLevel=5
          --output ./aot-output
        env:
          DOTNET_EnableAotCompilationWarningsAsErrors: true

      - name: Run NativeAOT binary
        run: |
          chmod +x ./aot-output/EricksonLopez.Events.AotSmokeTest
          ./aot-output/EricksonLopez.Events.AotSmokeTest
          echo "Exit code: $?"

      - name: Upload AOT artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aot-output-${{ github.run_id }}
          path: ./aot-output/
          retention-days: 7
