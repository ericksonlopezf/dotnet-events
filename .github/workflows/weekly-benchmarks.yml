name: Weekly Benchmarks (Deep Review)

# ─── Purpose ─────────────────────────────────────────────────────────────────
# Runs a deep BenchmarkDotNet review across multiple frameworks (.NET 8, 9, and 10)
# every week. This runs the Default Job configuration to get 
# statistically rigorous results without blocking the developer's day-to-day PRs.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      benchmark-filter:
        description: "BenchmarkDotNet filter glob (e.g. '*Dispatcher*', '*' for all)"
        required: false
        default: "*"
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  benchmark:
    name: Weekly Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET (multi-version for cross-TFM benchmarks)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.Events.snk
          fi

      - name: Restore dependencies
        run: dotnet restore EricksonLopez.Events.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.Events.slnx --no-restore --configuration Release

      - name: Run benchmarks
        run: >
          dotnet run
          --project benchmarks/EricksonLopez.Events.Benchmarks/EricksonLopez.Events.Benchmarks.csproj
          --configuration Release
          --framework net10.0
          --
          --filter "${{ inputs.benchmark-filter || '*' }}"
          --runtimes net8.0 net9.0 net10.0
          --exporters json markdown
          --artifacts ./benchmarks/results

      - name: Upload benchmark results as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-benchmark-results-${{ github.run_id }}
          path: benchmarks/results/
          retention-days: 90

      - name: Commit benchmark results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/
          if git diff --staged --quiet; then
            echo "No benchmark result changes to commit."
          else
            git commit -m "chore(benchmarks): update weekly performance baseline [skip ci]

          Run: ${{ github.run_id }}
          Trigger: Weekly Schedule
          Runtime: .NET 8.0 + .NET 9.0 + .NET 10.0 (Deep Review)
          "
            if [ "${{ github.ref_type }}" = "branch" ]; then
              TARGET_BRANCH="${{ github.ref_name }}"
            else
              TARGET_BRANCH="${{ github.event.repository.default_branch || 'main' }}"
            fi
            git pull origin "$TARGET_BRANCH" --rebase --autostash || true
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Post benchmark summary to Step Summary
        if: always()
        run: |
          FOUND=0
          for SUMMARY in $(find benchmarks/results -name "*.md" 2>/dev/null | sort); do
            echo "## $(basename $SUMMARY)" >> "$GITHUB_STEP_SUMMARY"
            cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            FOUND=1
          done
          if [ $FOUND -eq 0 ]; then
            echo "### ⚠️ No benchmark markdown results found" >> "$GITHUB_STEP_SUMMARY"
          fi
